

services:
  elite-fitness-api: 
    container_name: elite-fitness-api
    restart: always
    image: node:20.10.0

    ports:
      - 4001:3007

    env_file:
      - .env

    volumes:
      - ./:/usr/src/elite-fitness

    working_dir: /usr/src/elite-fitness

    networks:
      - monorepo-network
    
    #FOR PRODUCTION
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"
 
    #command: bash -c "npm install &&  && npm run start:dev"
 


  elite-fitness-batch: 
    container_name: elite-fitness-batch

    restart: unless-stopped
    image: node:20.10.0

    ports:
      - 4002:3005

    volumes:
      - ./:/usr/src/elite-fitness

    working_dir: /usr/src/elite-fitness

    networks:
      - monorepo-network
    
    #FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

  
networks:
  monorepo-network:
    driver: bridge



# elite-fitness-api: localhost:4001 <==> container:3004
# elite-fitness-next: localhost:4000 <==> container:3000
#elite-fitness-batch: localhost:4002 <==> container:3005
